services:
  mosaic:
    build:
      context: .
      dockerfile: Dockerfile
    image: mosaic-social:local
    ports:
      - "3000:3000"
    environment:
      CENTRAL_RBAC_URL: ${CENTRAL_RBAC_URL:-https://central-auth-pe9z.onrender.com}
      CENTRAL_RBAC_PROJECT_API_KEY: ${CENTRAL_RBAC_PROJECT_API_KEY:-}
      MOSAIC_EMAIL_VERIFICATION_ENABLED: ${MOSAIC_EMAIL_VERIFICATION_ENABLED:-true}
      MOSAIC_MOBILE_OTP_ENABLED: ${MOSAIC_MOBILE_OTP_ENABLED:-false}
      MOSAIC_VERSION: docker-local
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped
